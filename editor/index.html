<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>文章编辑器 · Fyw0o's blogs</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body class="max-width mx-auto px3 ltr">
  <main class="editor-shell">
    <header class="editor-header">
      <div>
        <p class="eyebrow">FYW0O'S BLOGS</p>
        <h1>文章编辑器</h1>
        <p class="muted">撰写、预览并直接提交到 GitHub Pages。</p>
      </div>
      <a class="text-link" href="/">← 返回主页</a>
    </header>

    <section class="card settings-card" aria-labelledby="connection-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CONNECTION</p>
          <h2 id="connection-title">GitHub 连接</h2>
        </div>
        <span id="connection-status" class="status idle">尚未验证</span>
      </div>
      <div class="settings-grid">
        <label>Owner<input id="owner" autocomplete="username" value="lvsany"></label>
        <label>Repository<input id="repo" value="lvsany.github.io"></label>
        <label>Branch<input id="branch" value="main"></label>
        <label class="token-field">Fine-grained personal access token
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
        </label>
      </div>
      <div class="actions compact-actions">
        <button id="verify" class="button secondary" type="button">验证 GitHub 身份</button>
        <button id="forget-token" class="button quiet" type="button">清除令牌</button>
        <p class="hint">令牌只保存在当前浏览器标签页，不会写入仓库。请创建仅对本仓库有 Contents: Read and write 权限的 fine-grained token。</p>
      </div>
    </section>

    <section class="workspace">
      <aside class="card article-list-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ARTICLES</p>
            <h2>已发布</h2>
          </div>
          <button id="new-article" class="button quiet" type="button">+ 新建</button>
        </div>
        <p id="list-empty" class="muted">还没有通过编辑器发布的文章。</p>
        <ul id="article-list" class="article-list" aria-label="已发布文章"></ul>
      </aside>

      <section class="editor-panel">
        <div class="card editor-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">DRAFT</p>
              <h2 id="form-heading">新文章</h2>
            </div>
            <span id="draft-state" class="status idle">未保存</span>
          </div>
          <form id="article-form">
            <div class="form-grid">
              <label class="wide">标题<input id="title" required maxlength="120" placeholder="给文章起一个标题"></label>
              <label>发布日期<input id="date" type="date" required></label>
              <label>标签（逗号分隔）<input id="tags" maxlength="160" placeholder="例如：notes, AI"></label>
              <label class="wide">简介<input id="summary" maxlength="280" placeholder="用于首页列表和文章描述"></label>
            </div>
            <label>正文（Markdown）
              <textarea id="body" required spellcheck="true" placeholder="# 从这里开始写\n\n支持标题、段落、列表、引用、代码块、链接、图片和粗体。"></textarea>
            </label>
            <div class="actions">
              <button id="preview-button" class="button secondary" type="button">更新预览</button>
              <button id="publish" class="button primary" type="submit">发布到 GitHub</button>
              <button id="delete" class="button danger" type="button" disabled>删除文章</button>
            </div>
            <p id="message" class="message" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="card preview-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">PREVIEW</p>
              <h2>文章预览</h2>
            </div>
          </div>
          <article id="preview" class="post preview-post">
            <h1>文章标题</h1>
            <p class="meta">发布日期</p>
            <div class="article-entry"><p>填写正文后，预览会显示在这里。</p></div>
          </article>
        </div>
      </section>
    </section>
  </main>
  <script src="/editor/editor.js"></script>
</body>
</html>
